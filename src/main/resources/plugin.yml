name: EndersTeams
version: '${version}'

main: io.github.loadingerror303.endersteams.EndersTeams
api-version: '1.21.11'
load: POSTWORLD
description: Survival teams with ore icons and menu-based team creation.
commands:
  team:
    description: Open the team creation menu.
    usage: /team create
    permission: endersteams.create
permissions:
  endersteams.create:
    description: Create a team using the team menu.
    default: true
