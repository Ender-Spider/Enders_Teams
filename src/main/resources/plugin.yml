name: EndersTeams
version: '${version}'

main: io.github.loadingerror303.endersteams.EndersTeams
api-version: '1.21.11'
load: POSTWORLD
description: Survival teams with block icons and menu-based team creation.
commands:
  team:
    description: Create and manage teams, invite players, and respond to invitations.
    usage: /team <menu|create|invite|accept|decline|leave>
permissions:
  endersteams.create:
    description: Create a team using the team menu.
    default: true
  endersteams.invite:
    description: Allow team owners to invite players through the menu.
    default: true
